# VisDrone-full cross-dataset evaluation set, mapped to NMV-SOD-3cls class ids.
#
# Purpose: zero-shot evaluation of NMV-trained models on the broader VisDrone
# scene (images NOT in NMV-SOD-3cls train/val/test) - tests whether the model
# generalises to scenes that also contain non-target classes (car, pedestrian,
# truck, etc.). Per the paper's §5.7 cross-dataset generalisation.
#
# Class mapping (VisDrone -> NMV-SOD-3cls):
#   VisDrone 'bicycle'  -> 1 (bicycle)
#   VisDrone 'motor'    -> 0 (ebike, approximate)  [motorcycle is closest to ebike geometry]
#   VisDrone 'tricycle' -> 2 (etrike)
#   VisDrone 'awning-tricycle' -> 2 (etrike, approximate)
#   All other VisDrone classes -> dropped (ignored by the converter)
#
# BUILT 2026-06-10 (scripts/build_visdrone_full_nmv3.py, motor mapping bug fixed, 10->0):
#   composition = 1916 VisDrone train images that never entered NMV + 48 VisDrone val images that never entered NMV
#               = 1964 held-out images, 603 NMV-class boxes (mostly zero-target negatives, so this measures the FP rate).
#   exclusion list: nmv_all_stems.txt (5056 stems; train/val/test all excluded).
#   As described in the manuscript: a same-source held-out robustness check, NOT true independent cross-domain
# Eval:
#   python scripts/eval_cross_dataset.py --run E16_mca_scale_assign_hi32_1280 \
#       --data configs/data/visdrone_full_nmv3.yaml --name visdrone_full

path: datasets/visdrone_full_nmv3
train: images/train          # not used for eval, kept for compatibility
val: images/val
test: images/val             # zero-shot eval uses val; no test split needed

nc: 3
names:
  0: ebike
  1: bicycle
  2: etrike
