# E19 (Full SOD model): yolov8m-p2-mca + CAGFPN (Context-Augmented GFPN).
# CAGFPN wraps backbone P3/P4 skip with ASPPLite before concat, expanding receptive
# field at fusion nodes. Ideal for small objects where context matters more than detail.
nc: 3
scales:
  m: [0.67, 0.75, 768]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  # === TD (top-down) path ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12  P4 TD

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15  P3 TD

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                     # 17
  - [-1, 3, C2f, [128]]                           # 18  P2 C2f
  - [-1, 1, MCA, [128, 4]]                        # 19  MCA on P2 features

  # === BU (bottom-up) path with CAGFPN (ASPP-augmented) skips ===
  - [-1, 1, Conv, [128, 3, 2]]                    # 20  downsample MCA'd P2 → P3
  - [4, 1, ASPPLite, [256]]                       # 21  ASPPLite on backbone P3 (CAGFPN context)
  - [[20, 15, 21], 1, Concat, [1]]                # 22  CAGFPN: down(MCA P2) + P3 TD + ASPP(bb P3)
  - [-1, 3, C2f, [256]]                           # 23  P3 BU

  - [-1, 1, Conv, [256, 3, 2]]                    # 24  downsample P3 BU → P4
  - [6, 1, ASPPLite, [512]]                       # 25  ASPPLite on backbone P4 (CAGFPN context)
  - [[24, 12, 25], 1, Concat, [1]]                # 26  CAGFPN: down(P3 BU) + P4 TD + ASPP(bb P4)
  - [-1, 3, C2f, [512]]                           # 27  P4 BU

  - [-1, 1, Conv, [512, 3, 2]]                    # 28  downsample P4 BU → P5
  - [[-1, 9], 1, Concat, [1]]                     # 29  cat backbone P5 (SPPF)
  - [-1, 3, C2f, [1024]]                          # 30  P5

  - [[19, 23, 27, 30], 1, Detect, [nc]]           # 31  Detect from MCA'd P2 + CAGFPN P3/P4 + P5
