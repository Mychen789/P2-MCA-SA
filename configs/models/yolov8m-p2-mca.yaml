# E16: yolov8m-p2 + MCA (Multi-branch Cross Attention) on P2 features.
# MCA fuses EMA (multi-group cross-spatial) with CoordAtt (directional) via gated concat.
# Channel-preserving; insertion at index 19 mirrors ema yaml for fair comparison.
nc: 3
scales:
  m: [0.67, 0.75, 768]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15  P3/8-small (TD)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                     # 17
  - [-1, 3, C2f, [128]]                           # 18  P2/4-xsmall C2f
  - [-1, 1, MCA, [128, 4]]                        # 19  MCA on P2 features

  - [-1, 1, Conv, [128, 3, 2]]                    # 20
  - [[-1, 15], 1, Concat, [1]]                    # 21  cat head P3 (TD)
  - [-1, 3, C2f, [256]]                           # 22  P3/8-small (BU)

  - [-1, 1, Conv, [256, 3, 2]]                    # 23
  - [[-1, 12], 1, Concat, [1]]                    # 24  cat head P4 (TD)
  - [-1, 3, C2f, [512]]                           # 25  P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                    # 26
  - [[-1, 9], 1, Concat, [1]]                     # 27  cat backbone P5
  - [-1, 3, C2f, [1024]]                          # 28  P5/32-large

  - [[19, 22, 25, 28], 1, Detect, [nc]]           # 29  Detect from MCA-refined P2 + PAN P3/P4/P5
