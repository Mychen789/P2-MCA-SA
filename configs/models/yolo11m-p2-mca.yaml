# YOLOv11m + P2 detection head + MCA on P2 features.
# Transfer experiment (E24): port this work's components (the stride-4 P2 head + MCA) onto the YOLOv11m backbone
# and compare against the E18 YOLOv11m baseline under matched conditions, to see whether they still add on a newer backbone.
# Scale-aware label assignment (HI_RATIO=32) is switched on by the NMV_SCALE_ASSIGN environment variable,
# not from this yaml (see the env of the E24 entry in scripts/train.py).
#
# backbone: layers 0-10 copied verbatim from the ultralytics yolo11.yaml (C3k2 blocks + a trailing C2PSA),
#           so that .load(yolo11m.pt) matches by layer name and the COCO-pretrained backbone weights load.
# head:     the 4-scale PAN of yolov8m-p2-mca.yaml (top-down to P2 + MCA, bottom-up back to P5),
#           but with C2f -> C3k2, and the P5 concat source taken from C2PSA (idx 10) rather than SPPF.
nc: 3
scales:
  # [depth, width, max_channels] - only m (YOLOv11m) is kept, matching the scale of the E18 baseline
  m: [0.50, 1.00, 512]

# YOLO11m backbone (copied from the official yolo11.yaml backbone)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2   <- P2/4 features (concat source for the P2 head)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4   <- P3/8 features (concat source)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6   <- P4/16 features (concat source)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10  <- P5 features (concat source for the P5 head)

# 4-scale P2 head (P2/4, P3/8, P4/16, P5/32) with C3k2 blocks; MCA is applied to the P2 detection features
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12  cat backbone P4 (idx6)
  - [-1, 2, C3k2, [512, False]]                   # 13  TD-P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15  cat backbone P3 (idx4)
  - [-1, 2, C3k2, [256, False]]                   # 16  TD-P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                     # 18  cat backbone P2 (idx2)
  - [-1, 2, C3k2, [128, False]]                   # 19  TD-P2/4 (xsmall)
  - [-1, 1, MCA, [128, 4]]                        # 20  MCA on P2 features (component of this work)

  - [-1, 1, Conv, [128, 3, 2]]                    # 21
  - [[-1, 16], 1, Concat, [1]]                    # 22  cat head P3 (TD idx16)
  - [-1, 2, C3k2, [256, False]]                   # 23  BU-P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                    # 24
  - [[-1, 13], 1, Concat, [1]]                    # 25  cat head P4 (TD idx13)
  - [-1, 2, C3k2, [512, False]]                   # 26  BU-P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                    # 27
  - [[-1, 10], 1, Concat, [1]]                    # 28  cat backbone P5 (C2PSA idx10)
  - [-1, 2, C3k2, [1024, True]]                   # 29  BU-P5/32-large

  - [[20, 23, 26, 29], 1, Detect, [nc]]           # 30  Detect(P2-MCA, P3, P4, P5)
