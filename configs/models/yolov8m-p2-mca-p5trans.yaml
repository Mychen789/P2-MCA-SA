# E17: yolov8m-p2 + MCA (on P2) + P5Transformer (global branch on P5/32).
# Hybrid CNN-Transformer architecture, the new main hero for the Neurocomputing submission.
#
# Pairs with scale-aware label assignment at train time (NMV_SCALE_ASSIGN=1
# + NMV_SCALE_HI_RATIO=32). The yaml itself does not encode scale-aware logic.
#
# Differences from yolov8m-p2-mca.yaml:
#   - inserts P5Transformer at idx 29, on top of the P5/32-large head (idx 28).
#   - Detect index shifted: now reads [19, 22, 25, 29] instead of [19, 22, 25, 28].
#
# P5Transformer hyperparams (defaults baked in the module): dim=192, n_layers=2,
# n_heads=4, ffn_mult=2. Zero-init proj_out + learnable pos embed (max_tokens=2048).
nc: 3
scales:
  m: [0.67, 0.75, 768]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f, [256, True]]        # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f, [512, True]]        # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                     # 11
  - [-1, 3, C2f, [512]]                           # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                     # 14
  - [-1, 3, C2f, [256]]                           # 15  P3/8-small (TD)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                     # 17
  - [-1, 3, C2f, [128]]                           # 18  P2/4-xsmall C2f
  - [-1, 1, MCA, [128, 4]]                        # 19  MCA on P2 features

  - [-1, 1, Conv, [128, 3, 2]]                    # 20
  - [[-1, 15], 1, Concat, [1]]                    # 21  cat head P3 (TD)
  - [-1, 3, C2f, [256]]                           # 22  P3/8-small (BU)

  - [-1, 1, Conv, [256, 3, 2]]                    # 23
  - [[-1, 12], 1, Concat, [1]]                    # 24  cat head P4 (TD)
  - [-1, 3, C2f, [512]]                           # 25  P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                    # 26
  - [[-1, 9], 1, Concat, [1]]                     # 27  cat backbone P5
  - [-1, 3, C2f, [1024]]                          # 28  P5/32-large
  - [-1, 1, P5Transformer, [1024]]                # 29  P5 Transformer global branch (channel-preserving)

  - [[19, 22, 25, 29], 1, Detect, [nc]]           # 30  Detect from MCA-refined P2 + PAN P3/P4 + Transformer-refined P5
